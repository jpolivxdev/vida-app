<div class="page">

  <div class="header">
    <div>
      <h2>Tarefas</h2>
      <p>{{ pendingCount }} pendente{{ pendingCount === 1 ? '' : 's' }}</p>
    </div>
    <button class="fab" (click)="openSheet()" aria-label="Nova tarefa">+</button>
  </div>

  <div class="tabs">
    <button [class.active]="filter === 'all'" (click)="filter = 'all'">Todas</button>
    <button [class.active]="filter === 'today'" (click)="filter = 'today'">Hoje</button>
    <button [class.active]="filter === 'upcoming'" (click)="filter = 'upcoming'">Próximas</button>
  </div>

  <div class="task-list">
    <div class="task-row" *ngFor="let task of pending">
      <button class="check" (click)="toggleDone(task.id)" aria-label="Marcar como feita"></button>

      <div class="task-info">
        <p class="task-text">{{ task.text }}</p>
        <p class="task-meta" *ngIf="task.time">{{ task.time }}</p>
      </div>

      <span class="badge" [class.urgent]="isUrgent(task.date)">
        {{ dateLabel(task.date) }}
      </span>

      <button class="delete" (click)="deleteTask(task.id)" aria-label="Excluir tarefa">×</button>
    </div>

    <p class="empty" *ngIf="pending.length === 0">
      Nenhuma tarefa por aqui
    </p>
  </div>

  <div class="completed-section" *ngIf="completed.length > 0">
    <p class="completed-label">Concluídas ({{ completed.length }})</p>

    <div class="completed-list">
      <div class="completed-row" *ngFor="let task of completed">
        <button class="check done" (click)="toggleDone(task.id)" aria-label="Desmarcar"></button>
        <p class="task-text done">{{ task.text }}</p>
        <button class="delete" (click)="deleteTask(task.id)" aria-label="Excluir tarefa">×</button>
      </div>
    </div>
  </div>

  <div class="sheet-backdrop" *ngIf="sheetOpen" (click)="closeSheet()"></div>

  <div class="sheet" [class.open]="sheetOpen">
    <div class="sheet-handle"></div>

    <h3>Nova tarefa</h3>

    <input [(ngModel)]="newText" placeholder="O que você precisa fazer?" autofocus />

    <div class="sheet-row">
      <input [(ngModel)]="newDate" type="date" />
      <input [(ngModel)]="newTime" type="time" />
    </div>

    <div class="sheet-actions">
      <button class="cancel" (click)="closeSheet()">Cancelar</button>
      <button class="confirm" (click)="addTask()">Adicionar</button>
    </div>
  </div>

</div>
